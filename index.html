<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

  <meta name="theme-color" content="#faf8f9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Мой цикл">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <title>Мой цикл 🧡</title>

  <link rel="stylesheet" href="./styles.css?v=1.1.0">
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>

<body>

  <header>

    <h1>
      Мой цикл <span class="orange">🧡</span>
    </h1>

    <div class="small">
      Начни День 1 в любой день
    </div>

    <div class="progress">
      <div class="progressFill" id="progressFill"></div>
    </div>

    <div class="small" id="progressText">
      Цикл еще не начат
    </div>

  </header>

  <header id="pdfHeader" class="pdf-header" style="display:none;">
    <button onclick="closePDF()" class="backBtn">← Назад</button>
    <h2>Массаж + дыхание • PDF</h2>
  </header>

  <main id="mainContent">

    <div id="hero"></div>

    <div class="tabs" id="tabs"></div>

    <div id="content"></div>

  </main>

  <!-- PDF Viewer Container -->
  <div id="pdfContainer" class="pdf-container" style="display:none;">
    <div id="pdfPages" class="pdf-pages"></div>
    <div id="pdfControls" class="pdf-controls">
      <button onclick="previousPage()" id="prevBtn">← Предыдущая</button>
      <span id="pageInfo"></span>
      <button onclick="nextPage()" id="nextBtn">Следующая →</button>
    </div>
  </div>

  <div class="footer" id="footer"></div>


  <script src="./diagnostic.js"></script>
  <script src="./storage.js"></script>
  <script src="./app.js?v=1.1.0" defer></script>

</body>

</html>

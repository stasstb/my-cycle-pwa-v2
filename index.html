<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="theme-color" content="#faf8f9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Пробуждение">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.svg">
  <title>Пробуждение 🧡</title>

  <link rel="stylesheet" href="./styles.css?v=2.0.26">
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>

<body>

  <header class="app-header">

    <div class="headerTopline">
      <h1>
        Пробуждение <span class="orange">🧡</span>
      </h1>
      <nav class="headerActions" aria-label="Навигация">
        <button type="button" class="headerIcon" onclick="goToHelp()" aria-label="Открыть справку"
          title="Справка">?</button>
        <button type="button" class="headerIcon" onclick="goToSettings()" aria-label="Открыть настройки"
          title="Настройки">⚙</button>
      </nav>
    </div>

    <div class="small">
      Начни День 1 в любой день <span class="versionLabel">v2.0.26</span>
    </div>

    <div class="progress">
      <div class="progressFill" id="progressFill"></div>
    </div>

    <div class="small" id="progressText">
      Цикл еще не начат
    </div>

  </header>

  <header id="pdfHeader" class="pdf-header" style="display:none;">
    <button onclick="closePDF()" class="backBtn">← Назад</button>
    <h2>Массаж + дыхание • PDF</h2>
  </header>

  <main id="mainContent">

    <div id="hero"></div>

    <div class="tabs" id="tabs"></div>

    <div id="content"></div>

    <div id="settings"></div>

  </main>

  <!-- PDF Viewer Container -->
  <div id="pdfContainer" class="pdf-container" style="display:none;">
    <div id="pdfPages" class="pdf-pages"></div>
    <div id="pdfControls" class="pdf-controls">
      <button onclick="previousPage()" id="prevBtn">← Предыдущая</button>
      <span id="pageInfo"></span>
      <button onclick="nextPage()" id="nextBtn">Следующая →</button>
    </div>
  </div>

  <div class="footer" id="footer"></div>
  <div id="installGuide" class="installGuide" hidden>
    <div class="installGuideCard" role="dialog" aria-modal="true" aria-labelledby="installGuideTitle">
      <div class="installGuideEyebrow"><span class="infoIcon">ⓘ</span> Справочная информация</div>
      <h2 id="installGuideTitle">Установка приложения</h2>
      <p id="installGuideIntro" class="installGuideIntro"></p>
      <div id="installSteps" class="installSteps"></div>
      <button type="button" class="installGuideClose" onclick="closeInstallGuide()">Понятно</button>
    </div>
  </div>
  <div id="appDialog" class="appDialog" hidden>
    <div class="appDialogCard" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle">
      <div class="appDialogBrand">Пробуждение <span class="orange">🧡</span></div>
      <h2 id="appDialogTitle">Сообщение</h2>
      <p id="appDialogMessage"></p>
      <div class="appDialogActions">
        <button type="button" id="appDialogCancel" class="appDialogCancel">Отмена</button>
        <button type="button" id="appDialogConfirm" class="appDialogConfirm">Понятно</button>
      </div>
    </div>
  </div>
  <input id="backupImportInput" type="file" accept="application/json" hidden>

  <script src="./diagnostic.js"></script>
  <script src="./storage.js"></script>
  <script src="./app.js?v=2.0.26" defer></script>

</body>

</html>
